<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign In - FitZone Gym Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/material_theme.css}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="glass-card text-center" style="width: 420px; padding: 2.5rem;">
        <h2 class="sidebar-brand justify-content-center mb-1">
            <i class="bi bi-lightning-charge-fill"></i> FITZONE GYM
        </h2>
        <p class="text-muted mb-4">Enterprise Management Portal</p>

        <form th:action="@{/login}" method="post">
            <div class="form-floating mb-3">
                <input type="text" class="form-control bg-dark text-light border-secondary" id="username" name="username" placeholder="admin" value="admin" required>
                <label for="username" class="text-secondary">Email / Username</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control bg-dark text-light border-secondary" id="password" name="password" placeholder="admin123" value="admin123" required>
                <label for="password" class="text-secondary">Password</label>
            </div>
            <button type="submit" class="btn btn-fitzone w-100 py-2 fs-5">
                Sign In <i class="bi bi-arrow-right-short"></i>
            </button>
        </form>
        <div class="mt-4 text-muted small">
            FitZone Gym Management System &copy; 2026
        </div>
    </div>
</body>
</html>
