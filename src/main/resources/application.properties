# Spring Boot Configuration - FitZone Gym Management System
server.port=${PORT:8080}

# Spring Datasource Configuration (Render Environment Variables with Local Fallback)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/gymdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Legacy Custom Connection Configuration Target: gymdb
db.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/gymdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
db.user=${DB_USERNAME:root}
db.password=${DB_PASSWORD:root}

# Spring MVC & Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Application Branding Settings
app.name=FitZone Gym Management System
app.version=1.0.0
app.currency=₹
