# Spring Boot Configuration - FitZone Gym Management System
server.port=8080

# Database Configuration Target: gymdb (Port 3307)
db.url=jdbc:mysql://localhost:3307/gymdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=

# Spring MVC & Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Application Branding Settings
app.name=FitZone Gym Management System
app.version=1.0.0
app.currency=₹
